services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kostan-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
    volumes:
      - kostan_data:/app/data
      - kostan_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kostan-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kostan_data:
    driver: local
  kostan_uploads:
    driver: local
